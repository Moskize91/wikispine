name: Release Wikispine

# Manual release workflow for the wikispine CLI and lightweight service image.
# The service image is deployed to the Singapore development FC only. Production
# functions are intentionally outside this workflow and require a manual update.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

env:
  ACR_REGISTRY: oomol-registry.ap-southeast-1.cr.aliyuncs.com
  ACR_IMAGE: oomol-registry.ap-southeast-1.cr.aliyuncs.com/oomol/wikispine-service
  ACR_INSTANCE_ID: cri-6pqcluf3zgqswn3a
  ACR_REGION: ap-southeast-1
  ALIYUN_FC_ROLE_ARN: acs:ram::1368962511430008:role/fc-dev-deploy
  ALIYUN_OIDC_PROVIDER_ARN: acs:ram::1368962511430008:oidc-provider/dev-oidc
  ALIYUN_OIDC_AUDIENCE: github-actions
  FC_DEV_FUNCTION_NAME: wikispine-dev

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release CLI must be run from main, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Read Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wikispine-runtime") | .version')"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not read wikispine-runtime version from Cargo metadata." >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"
          echo "Release tag: ${tag}"

      - name: Refuse duplicate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Bump the Cargo version before releasing again." >&2
            exit 1
          fi

  package:
    name: Package CLI ${{ matrix.artifact }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            archive: tar.gz
            bin: wikispine
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            archive: tar.gz
            bin: wikispine
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            archive: tar.gz
            bin: wikispine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            archive: zip
            bin: wikispine.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        run: cargo build --release -p wikispine-runtime --bin wikispine --target ${{ matrix.target }}

      - name: Package Unix CLI
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          package="wikispine-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${package}/"
          cp README.md LICENSE "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          cd dist
          shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Package Windows CLI
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "wikispine-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path "dist/$package"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$package/"
          Copy-Item README.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          Push-Location dist
          (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLower() + "  $package.zip" |
            Set-Content -NoNewline "$package.zip.sha256"
          Add-Content "$package.zip.sha256" "`n" -NoNewline
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: wikispine-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  service-image:
    name: Publish service image
    needs: prepare
    uses: ./.github/workflows/publish-service-image.yml
    with:
      tag: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
      packages: write

  deploy-dev-fc:
    name: Deploy service image to Singapore dev FC
    needs: service-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure Alibaba Cloud credentials
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          role-to-assume: ${{ env.ALIYUN_FC_ROLE_ARN }}
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIYUN_OIDC_AUDIENCE }}
          role-session-name: github-wikispine-fc-${{ github.run_id }}-${{ github.run_attempt }}
          role-session-expiration: 1800

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: "3.4.11"

      - name: Configure Alibaba Cloud CLI
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          ALIYUN_SECURITY_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
        run: |
          set -euo pipefail
          aliyun configure set \
            --mode StsToken \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --sts-token "$ALIYUN_SECURITY_TOKEN" \
            --region "$ACR_REGION"

      - name: Update development FC image
        run: |
          set -euo pipefail
          python3 scripts/deploy-dev-fc.py \
            --function-name "$FC_DEV_FUNCTION_NAME" \
            --image "${{ needs.service-image.outputs.image }}" \
            --acr-instance-id "$ACR_INSTANCE_ID" \
            --region "$ACR_REGION"

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
      - deploy-dev-fc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Bump the Cargo version before releasing again." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          This release contains prebuilt `wikispine` CLI binaries and a service image.

          The service image is published to Singapore ACR and deployed to the
          `wikispine-dev` Function Compute function. It does not include the runtime
          dataset, which remains mounted from NAS.

          After installing the CLI, run:

          ```bash
          wikispine init
          wikispine doctor
          ```
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: wikispine ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
