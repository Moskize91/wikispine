name: Release Service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-service-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: oomol-registry.ap-southeast-1.cr.aliyuncs.com
  ACR_IMAGE: oomol-registry.ap-southeast-1.cr.aliyuncs.com/oomol/wikispine-service
  ACR_INSTANCE_ID: cri-6pqcluf3zgqswn3a
  ACR_REGION: ap-southeast-1
  ACR_API_ENDPOINT: cr.ap-southeast-1.aliyuncs.com
  ALIYUN_ACR_ROLE_ARN: acs:ram::1354810585726671:role/docker-registry
  ALIYUN_ACR_OIDC_PROVIDER_ARN: acs:ram::1354810585726671:oidc-provider/github-oomol
  ALIYUN_ACR_OIDC_AUDIENCE: github-actions
  ALIYUN_FC_ROLE_ARN: acs:ram::1368962511430008:role/fc-dev-deploy
  ALIYUN_OIDC_PROVIDER_ARN: acs:ram::1368962511430008:oidc-provider/dev-oidc
  ALIYUN_OIDC_AUDIENCE: github-actions
  FC_DEV_FUNCTION_NAME: wikispine-dev

jobs:
  service-image:
    name: Publish service image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release Service must be run from main, got $GITHUB_REF_NAME." >&2
            exit 1
          fi
      - name: Configure Alibaba Cloud credentials
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          role-to-assume: ${{ env.ALIYUN_ACR_ROLE_ARN }}
          oidc-provider-arn: ${{ env.ALIYUN_ACR_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIYUN_ACR_OIDC_AUDIENCE }}
          role-session-name: github-wikispine-acr-${{ github.run_id }}-${{ github.run_attempt }}
          role-session-expiration: 1800
      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: "3.4.11"
      - name: Get temporary registry token
        id: registry-token
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          ALIYUN_SECURITY_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
        shell: bash
        run: |
          set -euo pipefail
          auth_json="$(aliyun cr GetAuthorizationToken \
            --mode StsToken \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --sts-token "$ALIYUN_SECURITY_TOKEN" \
            --region "$ACR_REGION" \
            --endpoint "$ACR_API_ENDPOINT" \
            --InstanceId "$ACR_INSTANCE_ID")"
          echo "username=$(jq -er '.TempUsername' <<<"$auth_json")" >> "$GITHUB_OUTPUT"
          echo "token=$(jq -er '.AuthorizationToken' <<<"$auth_json")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ steps.registry-token.outputs.username }}
          password: ${{ steps.registry-token.outputs.token }}
      - name: Prepare service image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="service-${GITHUB_SHA:0:12}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${ACR_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${owner}/wikispine-service:${tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push missing service tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_image }}
        run: |
          set -euo pipefail
          tags=()
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            tags+=(--tag "$IMAGE")
          fi
          if ! docker manifest inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
            tags+=(--tag "$GHCR_IMAGE")
          fi
          if ((${#tags[@]} == 0)); then
            echo "Service images already exist; reusing $IMAGE"
            exit 0
          fi
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -f docker/Dockerfile \
            "${tags[@]}" \
            --push \
            .
      - name: Wait for the ACR image to become readable
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "ACR image is readable: $IMAGE"
              exit 0
            fi
            echo "Waiting for ACR image visibility (attempt $attempt/12)"
            sleep 5
          done
          echo "ACR image did not become readable: $IMAGE" >&2
          exit 1
      - name: Publish service image summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "Service image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev-fc:
    name: Deploy service image to Singapore dev FC
    needs: service-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Alibaba Cloud credentials
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          role-to-assume: ${{ env.ALIYUN_FC_ROLE_ARN }}
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIYUN_OIDC_AUDIENCE }}
          role-session-name: github-wikispine-fc-${{ github.run_id }}-${{ github.run_attempt }}
          role-session-expiration: 1800
      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: "3.4.11"
      - name: Configure Alibaba Cloud CLI
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          ALIYUN_SECURITY_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
        run: |
          set -euo pipefail
          aliyun configure set --mode StsToken \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --sts-token "$ALIYUN_SECURITY_TOKEN" \
            --region "$ACR_REGION"
      - name: Update development FC image
        run: |
          set -euo pipefail
          python3 scripts/deploy-dev-fc.py \
            --function-name "$FC_DEV_FUNCTION_NAME" \
            --image "${{ needs.service-image.outputs.image }}" \
            --region "$ACR_REGION"
