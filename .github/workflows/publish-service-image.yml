name: Publish Service Image

# Manual workflow for the lightweight wikispine HTTP service image.
# It does not build or package runtime data; data/runtime must be mounted at runtime.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, e.g. service-20260702 or service-20260702-1.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-service-image
  cancel-in-progress: false

env:
  ALIYUN_ACR_REGISTRY: oomol-registry.ap-southeast-1.cr.aliyuncs.com
  ALIYUN_ACR_IMAGE: oomol-registry.ap-southeast-1.cr.aliyuncs.com/oomol/wikispine-service

jobs:
  aliyun:
    name: Prepare Alibaba Cloud registry token
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aliyun-registry.yml

  publish:
    name: Build and publish service image
    runs-on: ubuntu-latest
    needs: aliyun

    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ ! "${tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: ${tag}" >&2
            echo "Use a Docker-compatible tag like service-20260702 or service-20260702-1." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Image tag: ${tag}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ needs.aliyun.outputs.username }}
          password: ${{ needs.aliyun.outputs.token }}

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/wikispine-service"
          tags=(
            "--tag" "${ghcr_image}:${tag}"
            "--tag" "${ALIYUN_ACR_IMAGE}:${tag}"
          )
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tags+=("--tag" "${ghcr_image}:latest")
            tags+=("--tag" "${ALIYUN_ACR_IMAGE}:latest")
          fi
          docker buildx build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            "${tags[@]}" \
            --push \
            .
